name: Blast Scan (reusable)

# Called from any repo via:
#   jobs:
#     blast:
#       uses: Pragadhesh/Blast/.github/workflows/blast-scan.yml@master
#       with:
#         runs_on: self-hosted   # only if DataHub isn't reachable from GitHub-hosted runners
#         setup_python: false    # skip actions/setup-python and use whatever's already on
#                                # PATH -- see the note below on why this matters for
#                                # self-hosted runners
#       secrets: inherit
# See examples/consumer-workflows/blast-scan.yml for the full wrapper a
# consumer repo adds (it owns the pull_request trigger -- this reusable
# workflow only owns the job). Blast now considers every changed file in
# the PR, not just a fixed path -- see docs/architecture.md. Entity
# resolution is DataHub search only, no per-repo config file needed.
#
# NOTE on setup_python: actions/setup-python tries to download and silently
# run a Python installer when the requested version isn't already in its
# tool cache. On a self-hosted runner that cache starts empty, and the
# installer invocation is known to be flaky on Windows runners in
# particular (fails with "'python-X.Y.Z-amd64.exe' is not recognized..."
# even though the download succeeded). Self-hosted runners are BYO-environment
# by nature -- if yours already has a working Python on PATH, set
# setup_python: false and skip the whole problem instead of fighting it.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label. Use a self-hosted runner if DataHub isn't reachable from GitHub-hosted runners (e.g. a local-only instance)."
        type: string
        default: "ubuntu-latest"
      setup_python:
        description: "Whether to run actions/setup-python. Set false on a self-hosted runner that already has a working Python on PATH."
        type: boolean
        default: true
      python_version:
        description: "Python version for actions/setup-python (ignored if setup_python is false)."
        type: string
        default: "3.11"
    secrets:
      OPENAI_API_KEY:
        required: false
      DATAHUB_SERVER:
        required: true
      DATAHUB_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout the calling repo
        uses: actions/checkout@v4

      - name: Checkout Blast
        uses: actions/checkout@v4
        with:
          repository: Pragadhesh/Blast
          ref: master
          path: .blast-agent

      - if: inputs.setup_python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Blast's dependencies
        run: pip install -r .blast-agent/requirements.txt

      # DataHub's MCP Server is spawned as a subprocess via `uvx
      # acryl-datahub-mcp-server` (see agents/_common/mcp_datahub_client.py).
      # Without uv on PATH that spawn fails and BLAST_DATAHUB_MODE=auto
      # silently falls back to GraphQL -- installing uv here is what makes
      # the MCP path actually reachable by default, on any runner.
      - name: Install uv (for DataHub MCP Server)
        uses: astral-sh/setup-uv@v9

      - name: Run blast-scan
        env:
          PYTHONIOENCODING: utf-8
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATAHUB_SERVER: ${{ secrets.DATAHUB_SERVER }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .blast-agent/agents/blast-scan/main.py
