name: Blast Scan (reusable)

# Called from any repo via:
#   jobs:
#     blast:
#       uses: Pragadhesh/Blast/.github/workflows/blast-scan.yml@main
#       with:
#         dbt_models_path: dbt/models/   # only if your dbt project isn't at models/
#         runs_on: self-hosted            # only if DataHub isn't reachable from GitHub-hosted runners
#       secrets: inherit
# See examples/consumer-workflows/blast-scan.yml for the full wrapper a
# consumer repo adds (it owns the pull_request trigger and path filter --
# this reusable workflow only owns the job).

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label. Use a self-hosted runner if DataHub isn't reachable from GitHub-hosted runners (e.g. a local-only instance)."
        type: string
        default: "ubuntu-latest"
      dbt_models_path:
        description: "Path prefix Blast filters changed files against, e.g. 'dbt/models/' if your dbt project isn't at the repo root."
        type: string
        default: "models/"
      dataset_urn_template:
        description: "URN template with a {model} placeholder. Leave blank to use Blast's dbt-platform default -- set this if your DataHub instance ingests via the postgres source instead."
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        required: false
      DATAHUB_SERVER:
        required: true
      DATAHUB_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout the calling repo
        uses: actions/checkout@v4

      - name: Checkout Blast
        uses: actions/checkout@v4
        with:
          repository: Pragadhesh/Blast
          ref: main
          path: .blast-agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blast's dependencies
        run: pip install -r .blast-agent/requirements.txt

      - name: Run blast-scan
        env:
          PYTHONIOENCODING: utf-8
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATAHUB_SERVER: ${{ secrets.DATAHUB_SERVER }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          BLAST_DBT_MODELS_PATH: ${{ inputs.dbt_models_path }}
          BLAST_DATASET_URN_TEMPLATE: ${{ inputs.dataset_urn_template }}
        run: python .blast-agent/agents/blast-scan/main.py
