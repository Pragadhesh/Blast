name: Splint Fix (reusable)

# Called from any repo via:
#   jobs:
#     splint:
#       if: github.event.issue.pull_request && contains(github.event.comment.body, '/blast-fix')
#       uses: Pragadhesh/Blast/.github/workflows/blast-fix.yml@master
#       with:
#         runs_on: self-hosted
#         setup_python: false   # see the note in blast-scan.yml on why
#       secrets: inherit
# See examples/consumer-workflows/blast-fix.yml for the full wrapper.
#
# NOTE: like any comment-triggered workflow, the default GITHUB_TOKEN has
# read-only access when the triggering PR comes from a fork -- Splint can't
# push a fix branch in that case. That's a GitHub platform constraint, not
# something this workflow can route around; document it for your users
# rather than being surprised by it.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label. Use a self-hosted runner if DataHub isn't reachable from GitHub-hosted runners (e.g. a local-only instance)."
        type: string
        default: "ubuntu-latest"
      setup_python:
        description: "Whether to run actions/setup-python. Set false on a self-hosted runner that already has a working Python on PATH."
        type: boolean
        default: true
      python_version:
        description: "Python version for actions/setup-python (ignored if setup_python is false)."
        type: string
        default: "3.11"
      models_root:
        description: "Where this repo's dbt models live, e.g. 'dbt/models/' if not at the repo root. DataHub's lineage doesn't expose source file paths, so Splint locates a model's file by this convention."
        type: string
        default: "models/"
    secrets:
      OPENAI_API_KEY:
        required: false
      DATAHUB_SERVER:
        required: true
      DATAHUB_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout the calling repo
        uses: actions/checkout@v4

      - name: Checkout Blast
        uses: actions/checkout@v4
        with:
          repository: Pragadhesh/Blast
          ref: master
          path: .blast-agent

      - if: inputs.setup_python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Blast's dependencies
        run: pip install -r .blast-agent/requirements.txt

      - name: Run Splint
        env:
          PYTHONIOENCODING: utf-8
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATAHUB_SERVER: ${{ secrets.DATAHUB_SERVER }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.issue.number }}
          BLAST_MODELS_ROOT: ${{ inputs.models_root }}
        run: python .blast-agent/agents/splint/main.py
