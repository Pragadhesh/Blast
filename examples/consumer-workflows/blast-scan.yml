# Copy this into any repo's .github/workflows/blast-scan.yml to adopt Blast.
# This is the whole integration -- no vendored Python, no local dependency
# install. Add OPENAI_API_KEY, DATAHUB_SERVER, DATAHUB_TOKEN as repository
# secrets first (Settings -> Secrets and variables -> Actions).
#
# Blast considers every changed file in the PR, any format -- there's no
# path filter to configure. To resolve a changed file to a DataHub entity,
# add a .blast/entities.yml convention file to this repo (see
# commerce-warehouse's for an example) or rely on DataHub search as a
# fallback.
#
# `runs_on: self-hosted` below is set because commerce-warehouse's DataHub
# instance is local-only and unreachable from GitHub-hosted runners. Delete
# that line (falls back to ubuntu-latest) if your DataHub is reachable from
# GitHub's cloud runners.

name: Blast

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  blast:
    uses: Pragadhesh/Blast/.github/workflows/blast-scan.yml@main
    with:
      runs_on: self-hosted
    secrets: inherit
