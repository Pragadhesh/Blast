# Copy this into any repo's .github/workflows/blast-scan.yml to adopt Blast.
# This is the whole integration -- no vendored Python, no local dependency
# install. Add OPENAI_API_KEY, DATAHUB_SERVER, DATAHUB_TOKEN as repository
# secrets first (Settings -> Secrets and variables -> Actions).
#
# Blast considers every changed file in the PR, any format -- there's no
# path filter to configure. Resolving a changed file to a DataHub entity is
# handled entirely by DataHub search -- no per-repo config needed.
#
# The `with:` block below is the actual, currently-running configuration
# from commerce-warehouse (Blast's own live demo repo), not a hypothetical:
#
# - `runs_on: self-hosted` -- commerce-warehouse's DataHub instance is
#   local-only and unreachable from GitHub-hosted runners. Delete this line
#   (falls back to ubuntu-latest) if your DataHub is reachable from GitHub's
#   cloud runners.
# - `setup_python: false` -- on the self-hosted Windows runner actually
#   running this, actions/setup-python's installer turned out to be flaky
#   (fails with "'python-X.Y.Z-amd64.exe' is not recognized..." even though
#   the download succeeded). The runner already has a working Python on
#   PATH, so this skips the installer entirely instead of fighting it.
#   Delete this line (defaults to true) if your self-hosted runner doesn't
#   already have Python, or if you're on ubuntu-latest.

name: Blast

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  blast:
    # A reusable workflow can never have more permissions than its caller
    # grants -- without this block, a repo with restrictive default token
    # permissions silently caps Blast down to pull-requests: none and the
    # workflow fails to even start.
    permissions:
      contents: read
      pull-requests: write
    uses: Pragadhesh/Blast/.github/workflows/blast-scan.yml@master
    with:
      runs_on: self-hosted
      setup_python: false
    secrets: inherit
