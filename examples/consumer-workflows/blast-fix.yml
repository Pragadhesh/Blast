# Copy this into any repo's .github/workflows/blast-fix.yml alongside
# blast-scan.yml to enable the /blast-fix comment trigger. Requires the
# same repository secrets as blast-scan.yml.
#
# NOTE: if PRs in this repo can come from forks, GITHUB_TOKEN won't have
# push access when triggered from a fork's PR -- that's a GitHub platform
# restriction on comment-triggered workflows, not something this wrapper
# can work around.
#
# The `with:` block below is the actual, currently-running configuration
# from commerce-warehouse (Blast's own live demo repo), not a hypothetical:
# `setup_python: false` because the self-hosted runner's actions/setup-python
# installer was flaky (see blast-scan.yml's wrapper for the full story), and
# `models_root: "dbt/models/"` because that repo's dbt project isn't at the
# repo root -- Splint needs to know where to look for a broken model's
# source file, since DataHub's lineage graph doesn't expose file paths.

name: Splint

on:
  issue_comment:
    types: [created]

jobs:
  splint:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/blast-fix')
    # Same reasoning as blast-scan.yml: a reusable workflow can't have more
    # permissions than its caller grants, so this needs to be declared here too.
    permissions:
      contents: write
      pull-requests: write
    uses: Pragadhesh/Blast/.github/workflows/blast-fix.yml@master
    with:
      runs_on: self-hosted
      setup_python: false
      models_root: "dbt/models/"   # wherever your dbt project's models/ actually lives --
                                    # defaults to "models/" (repo root) if omitted
    secrets: inherit
